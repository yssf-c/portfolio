<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 22 184 176">
  <!-- The arms of the University of Ottawa, redrawn from the blazon in the Public Register of Arms, Flags and Badges of Canada (vol. II, p. 26). -->
  <defs>
    <clipPath id="sh"><path d="M12,6 H108 V60 C108,88 86,106 60,118 C34,106 12,88 12,60 Z"/></clipPath>
    <pattern id="seme" width="16" height="19" patternUnits="userSpaceOnUse" patternTransform="translate(4 3.5)">
      <path fill="#fdfbf6" d="M-3,-3.6 H3 V0.6 C3,2.6 1.6,3.8 0,4.6 C-1.6,3.8 -3,2.6 -3,0.6 Z" transform="translate(4 5)"/>
      <path fill="#fdfbf6" d="M-3,-3.6 H3 V0.6 C3,2.6 1.6,3.8 0,4.6 C-1.6,3.8 -3,2.6 -3,0.6 Z" transform="translate(12 14.5)"/>
    </pattern>
    <g id="horse">
      <!-- tail -->
      <path fill="#d6b24a" stroke="#6b5520" stroke-width="0.5" d="M9,42 C3,46 -1,56 1,70 C4,62 7,56 11,50 Z"/>
      <!-- body -->
      <path fill="#fdfcf8" stroke="#4a3a3a" stroke-width="0.7" stroke-linejoin="round" d="M33.5,1 L37,6.5 C41,9 44.5,11.500 45.5,15 C45.800,17.500 44,19 42,18.500 C40.500,18.200 39.500,17.200 38.500,17.500 C37.500,20.500 37,24 37.500,27 L44,25.500 L49,29.500 L50,35 L47,35.500 L46,32 L42.500,30.500 L37.500,32.500 L43,37.500 L47,42 L47,47.500 L44,47.500 L43,43.500 L38,41 C36,41 34,41.500 33,43.500 C31,49 28.500,53 25.500,56 L29,62.500 L30,70 L32.500,76.500 L28,77.500 L26,71 L22.500,64.500 L19.500,61 L17,66.500 L20,74 L22,79.500 L16.500,79.500 L14,72 L11.500,65 C9,60 8,53 9.500,47 C10.500,41 14,32 20,25 C24,17 28,10 32,6.500 Z"/>
      <!-- mane -->
      <path fill="#d6b24a" stroke="#6b5520" stroke-width="0.5" stroke-linejoin="round" d="M33.500,1 L32,6.500 C28,10 24,17 20,25 C19,21 20,17 22.500,14 C21.500,12.500 23,9.500 26,8 C26.500,5.500 29.500,2.500 33.500,1 Z"/>
      <!-- collar -->
      <path fill="none" stroke="#2b5ca8" stroke-width="2.2" stroke-linecap="round" d="M25.5,16.5 q3.5,0.6 5.5,3.2 t6.3,4.6"/>
      <!-- hooves -->
      <path fill="#d6b24a" stroke="#6b5520" stroke-width="0.4" d="M47,35.500 L50,35 L50.300,37.200 L47.300,37.600 Z M44,47.500 H47 V49.700 H44 Z M28,77.500 L32.500,76.500 L33,79 L28.500,80 Z M16.500,79.500 H22 V82 H16.500 Z"/>
      <!-- eye -->
      <circle cx="40.200" cy="11.600" r="0.75" fill="#3a2a2a"/>
    </g>
  </defs>
  <!-- mound -->
  <path fill="#3f7f3d" stroke="#23491f" stroke-width="0.7" d="M34,170 C56,146 164,146 186,170 C150,182 70,182 34,170 Z"/>
  <path fill="none" stroke="#fdfbf6" stroke-width="3.4" stroke-linecap="round" d="M76,173 q4,-5 8,-2 t8,-4 M144,173 q-4,-5 -8,-2 t-8,-4"/>
  <path fill="none" stroke="#2b5ca8" stroke-width="1.1" stroke-linecap="round" d="M76,173 q4,-5 8,-2 t8,-4 M144,173 q-4,-5 -8,-2 t-8,-4"/>
  <!-- maple leaf -->
  <path fill="#d6b24a" stroke="#6b5520" stroke-width="0.4" stroke-linejoin="round" transform="translate(110 164) scale(0.62)" d="M0,-12 L2.500,-7 L5.500,-8.500 L4.500,-2 L9,-5 L9.500,-2.500 L13,-2 L9,2 L10,4 L2,5 L1,10 H-1 L-2,5 L-10,4 L-9,2 L-13,-2 L-9.500,-2.500 L-9,-5 L-4.500,-2 L-5.500,-8.500 L-2.500,-7 Z"/>
  <!-- supporters -->
  <use href="#horse" transform="translate(30 73) scale(1.1)"/>
  <use href="#horse" transform="translate(190 73) scale(-1.1 1.1)"/>
  <!-- crest: temple front -->
  <g stroke="#4a3a3a" stroke-width="0.5" stroke-linejoin="round">
    <path fill="#f3efe4" d="M92,40 L110,27 L128,40 Z"/>
    <path fill="#f3efe4" d="M93,40 H127 V43 H93 Z M94,58 H126 V61 H94 Z"/>
    <path fill="#f3efe4" d="M95.500,43 h3 v15 h-3 Z M100.700,43 h3 v15 h-3 Z M105.900,43 h3 v15 h-3 Z M111.100,43 h3 v15 h-3 Z M116.300,43 h3 v15 h-3 Z M121.500,43 h3 v15 h-3 Z"/>
    <path fill="#d6b24a" d="M106.500,37.500 h7 l-1.200,-1.800 h-4.600 Z M110,35.500 c-1.800,-1.800 0.600,-2.800 0,-5 c2,1.600 2.400,3.400 0,5 Z"/>
    <!-- circlet -->
    <path fill="#d6b24a" d="M91,61 H129 V65.500 H91 Z"/>
    <g fill="#fdfbf6"><circle cx="96" cy="63.200" r="1.500"/><circle cx="105.300" cy="63.200" r="1.500"/><circle cx="114.700" cy="63.200" r="1.500"/><circle cx="124" cy="63.200" r="1.500"/></g>
    <g fill="#2b5ca8" stroke="none"><circle cx="100.650" cy="63.200" r="1.150"/><circle cx="110" cy="63.200" r="1.150"/><circle cx="119.350" cy="63.200" r="1.150"/></g>
    <!-- wreath -->
    <path fill="#fdfbf6" d="M92,65.500 H128 V69.500 H92 Z"/>
    <path fill="#8f1d2c" stroke="none" d="M96,65.800 l3,0 l-2,3.400 l-3,0 Z M103,65.800 l3,0 l-2,3.400 l-3,0 Z M110,65.800 l3,0 l-2,3.400 l-3,0 Z M117,65.800 l3,0 l-2,3.400 l-3,0 Z M124,65.800 l3,0 l-2,3.400 l-3,0 Z"/>
  </g>
  <!-- shield -->
  <g transform="translate(78.800 68) scale(0.52)">
    <path fill="#8f1d2c" d="M12,6 H108 V60 C108,88 86,106 60,118 C34,106 12,88 12,60 Z"/>
    <g clip-path="url(#sh)">
      <rect width="120" height="120" fill="url(#seme)"/>
      <rect x="0" y="42" width="120" height="30" fill="#fdfbf6"/>
      <g id="books">
        <g transform="translate(37 56.500)">
          <path fill="#8f1d2c" d="M-13,7 C-9,5 -4,5 0,7.500 C4,5 9,5 13,7 V8.800 C9,6.800 4,6.800 0,9.300 C-4,6.800 -9,6.800 -13,8.800 Z"/>
          <path fill="#fffdf8" stroke="#b08a34" stroke-width="0.7" d="M0,-6.500 C-4,-9 -9,-9 -13,-7 V7 C-9,5 -4,5 0,7.500 Z"/>
          <path fill="#fffdf8" stroke="#b08a34" stroke-width="0.7" d="M0,-6.500 C4,-9 9,-9 13,-7 V7 C9,5 4,5 0,7.500 Z"/>
          <circle cx="-6.500" cy="-1" r="2.600" fill="#8f1d2c"/>
        </g>
        <g transform="translate(83 56.500)">
          <path fill="#8f1d2c" d="M-13,7 C-9,5 -4,5 0,7.500 C4,5 9,5 13,7 V8.800 C9,6.800 4,6.800 0,9.300 C-4,6.800 -9,6.800 -13,8.800 Z"/>
          <path fill="#fffdf8" stroke="#b08a34" stroke-width="0.7" d="M0,-6.500 C-4,-9 -9,-9 -13,-7 V7 C-9,5 -4,5 0,7.500 Z"/>
          <path fill="#fffdf8" stroke="#b08a34" stroke-width="0.7" d="M0,-6.500 C4,-9 9,-9 13,-7 V7 C9,5 4,5 0,7.500 Z"/>
          <path fill="#8f1d2c" d="M-6.500,-5 C-5,-3 -5,-1 -6.500,0.500 C-8,-1 -8,-3 -6.500,-5 Z M-9.500,-1.500 h6 v1 h-6 Z M-6.500,0.500 l1.300,2 h-2.600 Z"/>
        </g>
      </g>
      <path fill="none" stroke="#5a0f1a" stroke-width="0.9" d="M0,42 H120 M0,72 H120"/>
    </g>
    <path fill="none" stroke="#4a1018" stroke-width="1.8" d="M12,6 H108 V60 C108,88 86,106 60,118 C34,106 12,88 12,60 Z"/>
  </g>
  <!-- motto scroll -->
  <path fill="#fdfbf6" stroke="#4a3a3a" stroke-width="0.6" stroke-linejoin="round" d="M46,174 C80,186 140,186 174,174 L176,184 C140,196 80,196 44,184 Z"/>
  <path fill="#e9e2d2" stroke="#4a3a3a" stroke-width="0.6" stroke-linejoin="round" d="M46,174 L38,170 L40,180 L44,184 Z M174,174 L182,170 L180,180 L176,184 Z"/>
  <path id="motto" fill="none" d="M48,181.500 C82,193 138,193 172,181.500"/>
  <text font-family="Times New Roman, Liberation Serif, serif" font-size="6.400" font-weight="700" letter-spacing="0.3" fill="#4a1018"><textPath href="#motto" startOffset="50%" text-anchor="middle">DEUS SCIENTIARUM DOMINUS EST</textPath></text>
</svg>
