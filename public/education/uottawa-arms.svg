  <path id="motto" fill="none" d="M70,189 C101,198.500 133,198.500 164,189"/>
  <text font-family="Times New Roman, Liberation Serif, serif" font-size="4.700" font-weight="700" fill="#a33a34"><textPath href="#motto" startOffset="50%" text-anchor="middle">DEUS SCIENTIARUM DOMINUS EST</textPath></text>
